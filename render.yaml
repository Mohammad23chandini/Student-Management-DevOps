services:
  - type: web
    name: student-management-app
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: DB_HOST
        value: localhost
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: student_management
      - key: DB_USER
        value: root
      - key: MYSQL_ROOT_PASSWORD
        value: anits
