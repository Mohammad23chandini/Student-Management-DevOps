services:
  - type: web
    name: student-management-app
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    port: 8081
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: MYSQL_ROOT_PASSWORD
        fromDatabase:
          name: student-management-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: student-management-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: student-management-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: student-management-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: student-management-db
          property: user

databases:
  - name: student-management-db
    databaseName: student_management
    user: root
    plan: free
    region: oregon
