apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: student-management
  labels:
    app.kubernetes.io/name: student-management-app
    app.kubernetes.io/component: service
spec:
  type: LoadBalancer
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
      name: http
  selector:
    app: student-management-app
