apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: student-management
  labels:
    app.kubernetes.io/name: student-management-app
    app.kubernetes.io/component: backend
data:
  SPRING_PROFILES_ACTIVE: "k8s,docker"
  SERVER_PORT: "8081"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_NAME: "student_management"
  DB_USER: "root"
