<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student — Student Management Pro</title>
    
    <!-- macOS Dashboard Design System -->
    <link rel="stylesheet" th:href="@{/css/macos-dashboard.css}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

<!-- Toast Notifications -->
<div class="toast-container">
    <div th:if="${errorMessage}" class="macos-toast">
        <div class="toast-icon error">✕</div>
        <div class="toast-content">
            <div class="toast-title">Attention</div>
            <div class="toast-msg" th:text="${errorMessage}">An error occurred.</div>
        </div>
    </div>
</div>

<!-- macOS Window Frame -->
<div class="macos-window" style="max-width: 600px; min-height: auto;">

    <!-- Titlebar -->
    <header class="window-header">
        <div class="window-traffic-lights">
            <a th:href="@{/students}" class="traffic-light close" title="Back to Students"></a>
            <span class="traffic-light minimize"></span>
            <span class="traffic-light zoom"></span>
        </div>

        <div class="window-title-container">
            <div class="window-app-icon">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
                </svg>
            </div>
            <span>Edit Academic & Billing Profile</span>
        </div>

        <div class="window-header-actions">
            <a th:href="@{/students}" class="btn btn-subtle btn-sm">✕ Cancel</a>
        </div>
    </header>

    <!-- Body Form -->
    <div style="padding: 24px;">
        <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border-subtle);">
            <div class="student-avatar" style="width: 44px; height: 44px; font-size: 15px; background: linear-gradient(135deg, #0071e3, #47a6ff);"
                 th:text="${student.initials}">ST</div>
            <div>
                <h2 style="font-size: 17px; font-weight: 650; margin-bottom: 2px;" th:text="${student.name}">Student Name</h2>
                <div style="font-size: 11px; color: var(--text-tertiary);" th:text="'Roll: ' + ${student.rollNumber} + ' | Database ID: #' + ${student.id}">Roll: 2026-001</div>
            </div>
        </div>

        <form th:action="@{/students/update/{id}(id=${student.id})}" method="post" class="needs-validation">
            <div class="form-section-divider">Student Identity</div>
            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label">Full Name <span class="required">*</span></label>
                    <input type="text" name="name" th:value="${student.name}" class="form-input" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address <span class="required">*</span></label>
                    <input type="email" name="email" th:value="${student.email}" class="form-input" required>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label">Roll Number</label>
                    <input type="text" name="rollNumber" th:value="${student.rollNumber}" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Department <span class="required">*</span></label>
                    <input list="departments-list-edit" name="course" th:value="${student.course}" class="form-input" required>
                    <datalist id="departments-list-edit">
                        <option value="Computer Science">
                        <option value="Information Technology">
                        <option value="Data Science">
                        <option value="Mechanical Engineering">
                        <option value="Electrical Engineering">
                        <option value="Business Administration">
                    </datalist>
                </div>
            </div>

            <div class="form-section-divider">Academic Performance</div>
            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label">Semester</label>
                    <select name="semester" class="form-input">
                        <option th:selected="${student.semester == 'Semester 1'}" value="Semester 1">Semester 1</option>
                        <option th:selected="${student.semester == 'Semester 2'}" value="Semester 2">Semester 2</option>
                        <option th:selected="${student.semester == 'Semester 3'}" value="Semester 3">Semester 3</option>
                        <option th:selected="${student.semester == 'Semester 4'}" value="Semester 4">Semester 4</option>
                        <option th:selected="${student.semester == 'Semester 5'}" value="Semester 5">Semester 5</option>
                        <option th:selected="${student.semester == 'Semester 6'}" value="Semester 6">Semester 6</option>
                        <option th:selected="${student.semester == 'Semester 7'}" value="Semester 7">Semester 7</option>
                        <option th:selected="${student.semester == 'Semester 8'}" value="Semester 8">Semester 8</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Cumulative GPA</label>
                    <input type="number" step="0.01" min="0" max="4.0" name="gpa" th:value="${student.gpa}" class="form-input">
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label">Attendance (%)</label>
                    <input type="number" min="0" max="100" name="attendance" th:value="${student.attendance}" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Registration Date</label>
                    <input type="date" name="registrationDate" th:value="${student.registrationDate}" class="form-input">
                </div>
            </div>

            <div class="form-section-divider">Tuition & Billing</div>
            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label">Total Tuition Fee ($)</label>
                    <input type="number" step="50" min="0" name="totalFee" th:value="${student.totalFee}" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Paid Amount ($)</label>
                    <input type="number" step="50" min="0" name="paidFee" th:value="${student.paidFee}" class="form-input">
                </div>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-subtle);">
                <a th:href="@{/students}" class="btn btn-secondary">Cancel</a>
                <div style="display: flex; gap: 8px;">
                    <a th:href="@{/students/delete/{id}(id=${student.id})}"
                       onclick="return confirm('Permanently delete this student record?')"
                       class="btn btn-danger btn-sm" style="padding: 7px 12px;">Delete</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </div>
        </form>
    </div>

</div>

</body>
</html>
