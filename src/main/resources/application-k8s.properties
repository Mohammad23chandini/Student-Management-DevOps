# Kubernetes Profile Configuration
spring.application.name=student-management

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-service}:${DB_PORT:3306}/${DB_NAME:student_management}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:anits}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=8081
